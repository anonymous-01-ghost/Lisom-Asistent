name: Publish private Android Maven packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Lisom Assistant
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Android KMP modules and Sherpa runtime
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew             :lisom-models:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-api:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-speech:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-wakeword:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-nlu:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-tts:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-core:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-platform:publishAndroidPublicationToLisomGitHubPackagesRepository             :lisom-platform:publishSherpaAndroidPublicationToLisomGitHubPackagesRepository
